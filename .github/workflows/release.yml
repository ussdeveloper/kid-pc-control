name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          echo "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Publish
        run: |
          $out = "artifacts/KidPcControl"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish src/KidPcControl.Admin/KidPcControl.Admin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $out
          dotnet publish src/KidPcControl.Service/KidPcControl.Service.csproj -c Release -r win-x64 --self-contained true -o $out
          dotnet publish src/KidPcControl.Tray/KidPcControl.Tray.csproj -c Release -r win-x64 --self-contained true -o $out
          dotnet publish src/KidPcControl.Agent/KidPcControl.Agent.csproj -c Release -r win-x64 --self-contained true -o $out
          dotnet publish src/KidPcControl.Setup/KidPcControl.Setup.csproj -c Release -r win-x64 --self-contained true -o $out
        shell: pwsh
      - name: Zip package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path artifacts/KidPcControl/* -DestinationPath "artifacts/KidPcControl-win-x64-v$ver.zip" -Force
          Get-FileHash "artifacts/KidPcControl-win-x64-v$ver.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  KidPcControl-win-x64-v$ver.zip" } |
            Set-Content "artifacts/SHA256SUMS.txt"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/KidPcControl-win-x64-v${{ steps.ver.outputs.version }}.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true

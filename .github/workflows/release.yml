name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          echo "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          (Get-Content installer/KidPcControl.iss -Raw) -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$ver`"" | Set-Content installer/KidPcControl.iss
          if (Test-Path Directory.Build.props) {
            (Get-Content Directory.Build.props -Raw) -replace '<Version>[^<]+</Version>', "<Version>$ver</Version>" | Set-Content Directory.Build.props
          }
          New-Item -ItemType Directory -Force -Path artifacts-setup | Out-Null
          ./installer/build-installer.ps1
          $setup = Get-ChildItem installer/output -Filter "KidPcControl-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup exe missing" }
          Copy-Item $setup.FullName "artifacts-setup/KidPcControl-Setup-v$ver.exe" -Force
          Get-FileHash "artifacts-setup/KidPcControl-Setup-v$ver.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  KidPcControl-Setup-v$ver.exe" } |
            Set-Content "artifacts-setup/SHA256SUMS.txt"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts-setup/KidPcControl-Setup-v${{ steps.ver.outputs.version }}.exe
            artifacts-setup/SHA256SUMS.txt
          generate_release_notes: true
